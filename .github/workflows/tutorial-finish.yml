name: Tutorial finish

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  thank-and-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const login = context.payload.pull_request.user.login;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `Nice change, @${login}! Thanks for trying Stim. This repo is the Stim tutorial app, so we close tutorial PRs automatically. See you in your next worktree.`,
            });
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['tutorial-finish'] });
            await github.rest.pulls.update({ owner, repo, pull_number: issue_number, state: 'closed' });
